name: AC-003 Owner Approval Publication

on:
  push:
    branches:
      - ac-003-canonical-repository-map
    paths:
      - '.github/workflows/ac-003-owner-approval.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ac-003-canonical-repository-map
          fetch-depth: 0

      - name: Publish approved AC-003 and synchronize canon
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import subprocess

          approved_blob = "2e6c70848beb3adcf9856a23fae2d26c0e20ff0e"
          proposal = Path("docs/governance/CANONICAL-REPOSITORY-STRUCTURE.md")
          actual_blob = subprocess.check_output(["git", "hash-object", str(proposal)], text=True).strip()
          if actual_blob != approved_blob:
              raise SystemExit(f"AC-003 proposal blob mismatch: expected {approved_blob}, got {actual_blob}")

          text = proposal.read_text()
          text = text.replace("Status: `Proposed`\nVersion: `0.9.0`", "Status: `Approved`\nVersion: `1.0.0`", 1)
          text = text.replace("Approval: `Pending explicit Owner decision`", "Approval: `docs/governance/decisions/DECISION-2026-08-20-AC-003-APPROVAL.md`\nApproved proposal: `Proposed 0.9.0`, blob `2e6c70848beb3adcf9856a23fae2d26c0e20ff0e`", 1)
          proposal.write_text(text)

          review = Path("docs/reviews/AC-003-CANONICAL-REPOSITORY-STRUCTURE-CROSS-REVIEW.md")
          text = review.read_text()
          text = text.replace("Result: `PASS — material consensus reached; explicit Owner approval still required`", "Result: `PASS — material consensus reached; Owner approval subsequently recorded`", 1)
          text = text.replace("Owner decision: `Pending`", "Owner decision: `docs/governance/decisions/DECISION-2026-08-20-AC-003-APPROVAL.md`", 1)
          review.write_text(text)

          decision = Path("docs/governance/decisions/DECISION-2026-08-20-AC-003-APPROVAL.md")
          decision.write_text("""# DECISION-2026-08-20 — AC-003 Canonical Repository Structure Approval

Status: `Approved`
Decision date: `2026-08-20`
Decision time: `09:20 +03:00`
Decision class: `Founding / Material Company Governance Boundary`
Decision authority: `Owner of Arvectum Company`
Repository: `arvectum/arvectum-company`
Roadmap item: `AC-003 — Canonical repository structure and artifact map`

## Decision

The Owner explicitly approved the exact proposal identified as:

- artifact: `docs/governance/CANONICAL-REPOSITORY-STRUCTURE.md`;
- proposal status/version: `Proposed 0.9.0`;
- approved proposal blob SHA: `2e6c70848beb3adcf9856a23fae2d26c0e20ff0e`;
- cross-review: `docs/reviews/AC-003-CANONICAL-REPOSITORY-STRUCTURE-CROSS-REVIEW.md`;
- cross-review result: `PASS — material consensus reached` after 7 of maximum 10 iterations.

Owner approval statement:

> Утверждаю AC-003 0.9.0

The proposal is therefore authorized for publication as `Approved 1.0.0` without changing its approved normative substance.

## Scope and authority effect

This decision approves the internal canonical repository structure and artifact-location rules for Arvectum Company.

It confirms, within Company governance scope, that:

- `arvectum/arvectum-company` is the canonical repository for durable, repository-suitable Company governance, planning, portfolio, organizational-model, operating-model and review artifacts;
- the repository is not a universal database or automatic canonical store for legal originals, banking, accounting, personnel, customer/supplier, product-domain or high-frequency runtime state;
- sensitive and restricted payloads are not admitted merely because Git storage is convenient;
- each durable artifact has one canonical home within its declared scope, while references and non-canonical copies must remain identifiable as such;
- Company, Product and Arvectum OS repository responsibilities remain distinct;
- logical directories are created only when a real admitted artifact requires them;
- GitHub `arvectum/arvectum-company` is the current canonical remote and GitVerse remains a non-authoritative resilience/sovereignty mirror unless a later approved decision changes that rule.

This approval does **not** amend the legal charter of ООО «Арвектум», make Git authoritative for facts governed by external legal/accounting/banking/product systems, amend Arvectum OS contracts, create a Product Contract, or authorize storage of secrets or restricted personal/customer data in the public repository.

## Publication actions authorized

1. Publish `docs/governance/CANONICAL-REPOSITORY-STRUCTURE.md` as `Approved 1.0.0`, preserving the exact approved `Proposed 0.9.0` blob reference.
2. Preserve the seven-iteration AC-003 cross-review as review evidence and record this Owner approval as the subsequent binding decision.
3. Update `docs/CANONICAL-SOURCES.md` so AC-003 and this decision are canonical Company governance sources.
4. Update `docs/roadmap/ROADMAP.md` to close `AC-003` as `Complete / PASS` and advance `AC-004 — Initial docs/portfolio/PORTFOLIO.md` to `Current`.
5. Perform read-after-write verification and merge the AC-003 pull request.

## Approval result

`APPROVED — AC-003 1.0.0 AUTHORIZED FOR PUBLICATION`
""")

          sources = Path("docs/CANONICAL-SOURCES.md")
          text = sources.read_text()
          text = text.replace("Version: `0.4.0`", "Version: `0.5.0`", 1)
          anchor = "| `docs/governance/decisions/DECISION-2026-08-20-AC-002-APPROVAL.md` | Approved | Owner approval record for exact AC-002 Proposed `0.9.0` and publication authority for `1.0.0` |\n"
          addition = anchor + "| `docs/governance/CANONICAL-REPOSITORY-STRUCTURE.md` | Approved `1.0.0` | Canonical repository structure and artifact-location map for durable Company assets |\n| `docs/governance/decisions/DECISION-2026-08-20-AC-003-APPROVAL.md` | Approved | Owner approval record for exact AC-003 Proposed `0.9.0` and publication authority for `1.0.0` |\n"
          if anchor not in text:
              raise SystemExit("CANONICAL-SOURCES insertion anchor not found")
          text = text.replace(anchor, addition, 1)
          sources.write_text(text)

          roadmap = Path("docs/roadmap/ROADMAP.md")
          text = roadmap.read_text()
          text = text.replace("Version: `0.3.0`", "Version: `0.4.0`", 1)
          text = text.replace("Current canonical action: `AC-003 — Canonical repository structure and artifact map`", "Current canonical action: `AC-004 — Initial docs/portfolio/PORTFOLIO.md`", 1)
          text = text.replace("| `AC-003` | Canonical repository structure and artifact map | `Current` |", "| `AC-003` | Canonical repository structure and artifact map | `Complete / PASS` |", 1)
          text = text.replace("| `AC-004` | Initial `docs/portfolio/PORTFOLIO.md` | `Planned` |", "| `AC-004` | Initial `docs/portfolio/PORTFOLIO.md` | `Current` |", 1)
          marker = "### M0 exit criteria\n"
          evidence = """AC-003 completion evidence:

- `docs/governance/CANONICAL-REPOSITORY-STRUCTURE.md` — `Approved 1.0.0`;
- `docs/reviews/AC-003-CANONICAL-REPOSITORY-STRUCTURE-CROSS-REVIEW.md` — `PASS`, 7/10 iterations, material consensus reached;
- `docs/governance/decisions/DECISION-2026-08-20-AC-003-APPROVAL.md` — explicit Owner approval of exact Proposed `0.9.0` blob and publication authority for `1.0.0`.

"""
          if marker not in text:
              raise SystemExit("ROADMAP M0 exit marker not found")
          text = text.replace(marker, evidence + marker, 1)
          roadmap.write_text(text)
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/governance/CANONICAL-REPOSITORY-STRUCTURE.md \
                  docs/reviews/AC-003-CANONICAL-REPOSITORY-STRUCTURE-CROSS-REVIEW.md \
                  docs/governance/decisions/DECISION-2026-08-20-AC-003-APPROVAL.md \
                  docs/CANONICAL-SOURCES.md \
                  docs/roadmap/ROADMAP.md
          git rm .github/workflows/ac-003-owner-approval.yml
          git commit -m "AC-003 — approve canonical repository structure"
          git push origin HEAD:ac-003-canonical-repository-map
