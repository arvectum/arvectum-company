name: GitVerse Mirror Smoke

on:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Push and verify GitVerse mirror
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Mirror current GitHub refs to GitVerse and verify main
        env:
          GITVERSE_TOKEN: ${{ secrets.GITVERSE_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          test -n "$GITVERSE_TOKEN" || { echo "::error::GITVERSE_TOKEN is missing"; exit 1; }

          expected_sha="$(git ls-remote \
            "https://x-access-token:${GH_TOKEN}@github.com/${GH_REPOSITORY}.git" \
            refs/heads/main | awk '{print $1}')"
          test -n "$expected_sha" || { echo "::error::GitHub main could not be resolved"; exit 1; }

          git clone --mirror \
            "https://x-access-token:${GH_TOKEN}@github.com/${GH_REPOSITORY}.git" \
            repository.git
          cd repository.git

          git remote add gitverse \
            "https://arvectum:${GITVERSE_TOKEN}@gitverse.ru/arvectum/arvectum-company.git"

          # Preserve GitVerse's bootstrap default branch as a compatibility alias.
          git update-ref refs/heads/master "$(git rev-parse refs/heads/main)"

          git push --force --prune gitverse \
            'refs/heads/*:refs/heads/*' \
            'refs/tags/*:refs/tags/*'

          remote_url="https://arvectum:${GITVERSE_TOKEN}@gitverse.ru/arvectum/arvectum-company.git"
          actual_main_sha="$(git ls-remote "$remote_url" refs/heads/main | awk '{print $1}')"
          actual_master_sha="$(git ls-remote "$remote_url" refs/heads/master | awk '{print $1}')"

          test -n "$actual_main_sha" || { echo "::error::GitVerse main is missing after mirror push"; exit 1; }
          test "$actual_main_sha" = "$expected_sha" || {
            echo "::error::GitVerse main mismatch: expected $expected_sha, got $actual_main_sha"
            exit 1
          }
          test "$actual_master_sha" = "$expected_sha" || {
            echo "::error::GitVerse master compatibility alias mismatch: expected $expected_sha, got $actual_master_sha"
            exit 1
          }

          echo "GitVerse main/master verified at $expected_sha"
