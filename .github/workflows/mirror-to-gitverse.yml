name: Mirror to GitVerse

on:
  push:
    branches:
      - '**'
    tags:
      - '**'
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: read

concurrency:
  group: mirror-to-gitverse
  cancel-in-progress: false

jobs:
  mirror:
    name: Mirror repository
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Validate configuration
        env:
          GITVERSE_TOKEN: ${{ secrets.GITVERSE_TOKEN }}
          GITVERSE_REPOSITORY: arvectum-company
        run: |
          set -euo pipefail
          test -n "$GITVERSE_TOKEN" || { echo "::error::GITVERSE_TOKEN is missing"; exit 1; }

      - name: Clone GitHub repository as mirror
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          git clone --mirror \
            "https://x-access-token:${GH_TOKEN}@github.com/${GH_REPOSITORY}.git" \
            repository.git

      - name: Push branches and tags to GitVerse
        env:
          GITVERSE_TOKEN: ${{ secrets.GITVERSE_TOKEN }}
          GITVERSE_REPOSITORY: arvectum-company
        run: |
          set -euo pipefail
          cd repository.git

          git remote add gitverse \
            "https://arvectum:${GITVERSE_TOKEN}@gitverse.ru/arvectum/${GITVERSE_REPOSITORY}.git"

          # GitVerse bootstrapped this repository with default branch `master`.
          # Its server rejects deletion of the default branch, so keep `master`
          # as a compatibility alias of GitHub `main` while `main` remains the
          # canonical branch. This also allows --prune to remove other stale refs.
          main_sha="$(git rev-parse refs/heads/main)"
          git update-ref refs/heads/master "$main_sha"

          # Mirror only normal branches and tags.
          # GitHub-specific refs/pull/* are intentionally excluded.
          git push --force --prune gitverse \
            'refs/heads/*:refs/heads/*' \
            'refs/tags/*:refs/tags/*'

      - name: Verify exact mirrored ref and master alias
        env:
          GITVERSE_TOKEN: ${{ secrets.GITVERSE_TOKEN }}
          GITVERSE_REPOSITORY: arvectum-company
        run: |
          set -euo pipefail
          cd repository.git

          remote_url="https://arvectum:${GITVERSE_TOKEN}@gitverse.ru/arvectum/${GITVERSE_REPOSITORY}.git"
          expected_sha="$(git rev-parse "$GITHUB_REF")"
          actual_sha="$(git ls-remote "$remote_url" "$GITHUB_REF" | awk '{print $1}')"

          test -n "$actual_sha" || { echo "::error::Mirrored ref $GITHUB_REF is missing on GitVerse"; exit 1; }
          test "$actual_sha" = "$expected_sha" || {
            echo "::error::GitVerse ref mismatch for $GITHUB_REF: expected $expected_sha, got $actual_sha"
            exit 1
          }

          github_main_sha="$(git rev-parse refs/heads/main)"
          gitverse_main_sha="$(git ls-remote "$remote_url" refs/heads/main | awk '{print $1}')"
          gitverse_master_sha="$(git ls-remote "$remote_url" refs/heads/master | awk '{print $1}')"

          test "$gitverse_main_sha" = "$github_main_sha" || {
            echo "::error::GitVerse main mismatch: expected $github_main_sha, got $gitverse_main_sha"
            exit 1
          }
          test "$gitverse_master_sha" = "$github_main_sha" || {
            echo "::error::GitVerse master compatibility alias mismatch: expected $github_main_sha, got $gitverse_master_sha"
            exit 1
          }

          echo "Verified $GITHUB_REF at $expected_sha"
          echo "Verified GitVerse main/master at GitHub main $github_main_sha"

      - name: Summary
        if: success()
        env:
          GITVERSE_REPOSITORY: arvectum-company
        run: |
          echo "### GitVerse mirror updated and verified" >> "$GITHUB_STEP_SUMMARY"
          echo "- Source: \`${GITHUB_REPOSITORY}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Target: \`arvectum/${GITVERSE_REPOSITORY}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Ref: \`${GITHUB_REF}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- GitVerse \`master\`: compatibility alias of GitHub \`main\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Trigger: \`${GITHUB_EVENT_NAME}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- SHA: \`${GITHUB_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
